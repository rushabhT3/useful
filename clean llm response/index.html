<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Cleaner</title>
    <link rel="icon" type="image/jpg" href="https://i.pinimg.com/736x/6a/88/4f/6a884f75f33c721dd8c44c64eaf25928.jpg">
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6; /* Electric Blue */
            --accent-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981; /* Emerald Green */
            --success-glow: rgba(16, 185, 129, 0.4);
            --text-main: #e4e4e7;
            --text-muted: #71717a;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.08), transparent 25%);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 700px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 0.5rem;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1.2;
        }

        .highlight {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            font-family: monospace;
            padding: 0 4px;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .glass-panel:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        .input-area { flex: 1; position: relative; }
        .output-area { flex: 1; position: relative; }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 1.5rem;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            font-family: var(--font-family);
        }

        textarea::placeholder { color: var(--text-muted); opacity: 0.7; }

        .label {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            pointer-events: none;
            font-weight: 600;
        }

        .action-bar { display: flex; justify-content: flex-end; }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 25px var(--accent-glow);
            filter: brightness(1.1);
        }
        
        button:active { transform: translateY(1px); }

        /* Success State Class */
        button.success {
            background: var(--success);
            box-shadow: 0 0 15px var(--success-glow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tired of <span class="highlight">**</span> in LLM response?<br>Then paste here.</h1>
        </header>

        <div class="glass-panel input-area" style="animation: fadeIn 0.8s ease-out 0.1s backwards;">
            <span class="label">Input</span>
            <textarea id="inputText" placeholder="Paste that messy bold text here..." autofocus></textarea>
        </div>

        <div class="glass-panel output-area" style="animation: fadeIn 0.8s ease-out 0.2s backwards;">
            <span class="label">Clean & Edit</span>
            <textarea id="outputText" placeholder="Your clean text will appear here. Feel free to edit it before copying..."></textarea>
        </div>

        <div class="action-bar" style="animation: fadeIn 0.8s ease-out 0.3s backwards;">
            <button id="copyBtn">
                <span id="btnText">Copy Clean Text</span>
            </button>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const copyBtn = document.getElementById('copyBtn');
        const btnText = document.getElementById('btnText');
        
        // Auto-clean logic (One way: Top -> Bottom)
        inputText.addEventListener('input', () => {
            const original = inputText.value;
            // Removes **
            let clean = original.split('**').join('');
            const parts = clean.split("---");
            if (parts.length > 1) {
                clean = parts[1].split("---")[0].trim();
            }
            clean = clean.replace(/\p{Extended_Pictographic}/gu, '');
            clean = clean.replace(/\([^)]*\)/g, '');
            outputText.value = clean;
        });

        // Robust Copy Logic
        copyBtn.addEventListener('click', () => {
            if (!outputText.value) return;

            // Try the modern API first
            if (navigator.clipboard) {
                navigator.clipboard.writeText(outputText.value)
                    .then(triggerSuccessEffect)
                    .catch(() => fallbackCopy()); 
            } else {
                fallbackCopy(); 
            }
        });

        // Fallback for file:// protocol or older browsers
        function fallbackCopy() {
            outputText.select();
            outputText.setSelectionRange(0, 99999); // For mobile
            try {
                document.execCommand('copy');
                triggerSuccessEffect();
                window.getSelection().removeAllRanges();
            } catch (err) {
                console.error("Fallback copy failed", err);
                btnText.innerText = "Error Copying";
            }
        }

        // Visual Feedback (3 seconds)
        function triggerSuccessEffect() {
            const originalLabel = "Copy Clean Text";
            
            btnText.innerText = "Copied!";
            copyBtn.classList.add('success');

            setTimeout(() => {
                btnText.innerText = originalLabel;
                copyBtn.classList.remove('success');
            }, 3000);
        }
    </script>
</body>
</html>
